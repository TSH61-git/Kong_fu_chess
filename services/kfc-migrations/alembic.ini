[alembic]
script_location = migrations
prepend_sys_path = .

# The real URL is supplied at runtime via the DATABASE_URL env var, read by
# migrations/env.py — this placeholder is only used by `alembic` tooling
# that insists on a value being present in the file.
sqlalchemy.url = postgresql://kfchess:kfchess@localhost:5432/kfchess

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
